<!DOCTYPE html>
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> COLOUR THEME PICKER</title>
    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <main id="myflexbox">


        <div id="mainspace">
            <h1> SMASH BABY KLEUR 'T </h1>
            <hr>
            <input type="tekst" id="usernameinput" placeholder="Nieuwe gebruiker...? Vul je naam in" />
            <h2> 1:KIES EEN KLEUR <br> 2:KIES EEN STYLE<br> 3: KUS CRAZY KLEUR!</h2>
            <input id="colourpicker" type="color" value="#e66465" />
            <label for="colour">
            </label>

            <select name="Stylen" id="styles">
                <option value="monochrome">monochrome</option>
                <option value="monochrome-dark">monochrome-dark</option>
                <option value="monochrome-light">monochrome-light</option>
                <option value="analogic">analogic</option>
                <option value="complement">complement</option>
                <option value="analogic-complement">analogic-complement</option>
            </select>

            <button id="startbutton">
                MAAK EEN KLEUREN SCHEMA
            </button>

            <br>
            <div class="hexdisplaywindow" id="colour1"> 1 </div>
            <div class="hexdisplaywindow" id="colour2">2</div>
            <div class="hexdisplaywindow" id="colour3"> 3</div>
            <div class="hexdisplaywindow" id="colour4">4 </div>
            <div class="hexdisplaywindow" id="colour5">5 </div>
            <div class="hexdisplaywindow" id="colour6">6 </div>

            <br>

            <p id="displayhex">
            </p>
            <button id="copykleuren">KOPIEER DE KLEUREN</button>
            <br>
            <hr>

            <input type="tekst" id="kleurensetnaam" placeholder="Geef je smashkleuren een naam">
            <br>
            <button id="slaitemsop">BEWAAR JE EERSTE SCHEMA</button>

        </div>

        <div id="userdata">
            <h3> Duik in de slapende kleuren...
                <br> van je eigen kleuren database
            </h3>
            <select name="Gebruikers" id="gebruikers">

            </select>

            <button id="btnhaaldataop">TOON MIJN KLEUREN </button>

            <button id="slaitemsop2">BEWAAR SCHEMA</button>
            <button id="btnreset">WIS ALLES <br></button>

            <div id="toongebruikersdata">

                <p id="deel1vanusertekst"></p>

                <!-- <p id="deel2vanusertekst"></p> -->

            </div>

        </div>




    </main>


















    <script src="script.js"></script>

</body>
