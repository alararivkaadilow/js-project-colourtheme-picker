<!DOCTYPE html>
<!DOCTYPE html>
<html lang="nl">

<head>

    <title> COLOUR THEME PICKER</title>
    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <main>


        <div id="mainspace">
            <h1> SMASH BABY KLEUR 'T </h1>

            <input id="colourpicker" type="color" value="#e66465" />
            <label for="colour">

            </label>


            <select name="Stylen" id="styles">
                <option value="monochrome">monochrome</option>
                <option value="monochrome-dark">monochrome-dark</option>
                <option value="monochrome-light">monochrome-light</option>
                <option value="analogic" selected>analogic</option>

            </select>


            <button id="startbutton">

                SMASH KLEUR NU!
            </button>

            <br>
            <div id="colour1"> </div>
            <div id="colour2"></div>
            <div id="colour3"></div>

            <div id="colour5"></div>

            <br>

            <p id="displayhex">

            </p>
            <hr>

            <input type="tekst" id="kleurensetnaam" placeholder="Geef je smashkleuren een naam">
            <button id="copykleuren">COPY <BR> KLEUR <br> KUS</button>
            <button id="slaitemsop">SLA <BR> KLEUREN <br> KLEUR</button>

        </div>


        <div id="mainspace">
            <h2> Duik in de slapende kleuren in je database</h2>
            <select name="Gebruikers" id="gebruikers">

            </select>

            <button id="btnhaaldataop">TOON<BR> MIJN <br> KLEUREN </button>
            <button id="btnreset">WIS <BR> ALLE <br> DATA <br></button>
            <button id="slaitemsop2">VOEG <BR> SCHEMA<br> TOE</button>
            <p id="toongebruikersdata"></p>
        </div>


    </main>
